name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)"
          if [ -z "$tag" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          artifact="build/libs/minigames-gui-${tag#v}-all.jar"
          if [ ! -f "$artifact" ]; then
            echo "Release artifact not found: $artifact" >&2
            exit 1
          fi
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$(basename "$artifact")" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        if: steps.release.outputs.released == 'true'
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: UeukxLtE
          version: ${{ steps.release.outputs.version }}
          loaders: |-
            paper
            purpur
          game-versions: |
            1.21.x
            26.1.x
            26.2.x
          files: ${{ steps.release.outputs.artifact }}
          primary-file: ${{ steps.release.outputs.artifact-name }}
          channel: release
          environment: server_only
